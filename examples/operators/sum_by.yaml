description: >-
  The membership reduction — `sum(array, over=dim, by=relation[c])` groups the
  result by the relation's column `c`, so the topology is data rather than
  structure.

dimensions:
  snapshot: { dtype: int }
  generator: { dtype: str }
  bus: { dtype: str }

properties:
  generator:
    bus: bus

parameters:
  limit: { dims: [snapshot, bus] }

variables:
  p:
    dims: [snapshot, generator]
    bounds: { lower: 0 }

constraints:
  bus_total:
    dims: [snapshot, bus]
    expression: sum(p, over=generator, by=generator[bus]) <= limit

objective: { sense: minimize, expression: sum(p) }

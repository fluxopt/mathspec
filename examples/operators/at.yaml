description: >-
  The join without a grouping — `at(array, by=relation[c])` reads one coarse
  value once for each fine label that points at it.

dimensions:
  snapshot: { dtype: int }
  period: { dtype: int }

properties:
  snapshot:
    period: period

parameters:
  cap: { dims: [period] }

variables:
  p:
    dims: [snapshot]
    bounds: { lower: 0 }

constraints:
  within_cap:
    dims: [snapshot]
    expression: p <= at(cap, by=snapshot[period])

objective: { sense: minimize, expression: sum(p) }

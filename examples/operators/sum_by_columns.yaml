description: >-
  A sum that keeps a key column — `sum(array, over=dim, by=relation[c])` joins
  on the column over `dim` and groups by column `c`. The sum also joins on the
  key column that the call does not name, and keeps it, so each zone gets one
  total per period.

dimensions:
  generator: { dtype: str }
  period: { dtype: int }
  zone: { dtype: str }

sets:
  generator_period: { dims: [generator, period] }

properties:
  generator_period:
    zone: zone

parameters:
  demand: { dims: [zone, period] }

variables:
  p:
    dims: [generator, period]
    bounds: { lower: 0 }

constraints:
  zone_balance:
    dims: [zone, period]
    expression: sum(p, over=generator, by=generator_period[zone]) >= demand

objective: { sense: minimize, expression: sum(p) }

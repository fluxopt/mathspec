description: >-
  Several columns at each end — `sum(array, over=[dim, …], by=relation[c, …])`
  joins on both key columns and groups by both value columns, all in one join.

dimensions:
  generator: { dtype: str }
  period: { dtype: int }
  bus: { dtype: str }
  technology: { dtype: str }

sets:
  generator_period: { dims: [generator, period] }

properties:
  generator_period:
    bus: bus
    technology: technology

parameters:
  cap: { dims: [bus, technology] }

variables:
  p:
    dims: [generator, period]
    bounds: { lower: 0 }

constraints:
  slot_cap:
    dims: [bus, technology]
    expression: sum(p, over=[generator, period], by=generator_period[bus, technology]) <= cap

objective: { sense: minimize, expression: sum(p) }
